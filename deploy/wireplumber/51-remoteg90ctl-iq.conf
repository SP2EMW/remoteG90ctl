#
# Keep PipeWire away from the I/Q card: the remoteg90ctl server opens it
# directly through ALSA (decisions.md D35). WirePlumber 0.5 syntax; for
# WirePlumber 0.4 use 51-remoteg90ctl-iq.lua instead.
#
# Install for the desktop user:
#   mkdir -p ~/.config/wireplumber/wireplumber.conf.d
#   cp deploy/wireplumber/51-remoteg90ctl-iq.conf ~/.config/wireplumber/wireplumber.conf.d/
#   systemctl --user restart wireplumber
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Speed_Dragon_USB_Advanced_Audio_Device*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
