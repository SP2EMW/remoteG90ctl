# SPDX-License-Identifier: GPL-3.0-or-later

[project]
name = "remoteG90ctl"
dynamic = ["version"]
description = "Local and remote control of the Xiegu G90 transceiver from a web browser"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    # Serial port access; the only third-party dependency allowed in the guard.
    "pyserial>=3.5",
    # Server only (stage 2, I/Q waterfall): FFT and the ALSA capture of the I/Q
    # card. The guard must never import them (AGENTS.md rule 11, tested).
    "numpy>=2.0",
    "sounddevice>=0.5",
    # Server only (stage 2b): HTTP and WebSocket for the browser, loopback only
    # until authentication (AGENTS.md rule 15).
    "aiohttp>=3.9",
    "ft8lib==1.3.2",
]

[project.scripts]
remoteg90ctl = "remoteg90ctl.cli:main"
remoteg90ctl-guard = "remoteg90ctl.guard.main:main"
remoteg90ctl-server = "remoteg90ctl.server.main:main"
remoteg90ctl-cluster = "remoteg90ctl.cluster.main:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "types-pyserial>=3.5",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/remoteg90ctl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/remoteg90ctl"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF", "PL", "PT", "T20", "CPY",
]
ignore = [
    "PLR2004", # magic values: CI-V byte constants are clearer inline in tests
    "PLR0911", # request handlers return one response per refusal reason, by design
]
preview = true
explicit-preview-rules = true
extend-select = ["CPY001"]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "SPDX-License-Identifier: GPL-3.0-or-later"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
