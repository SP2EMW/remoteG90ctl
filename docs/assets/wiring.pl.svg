.h{font-size:14px;font-weight:600} .s{font-size:12px}
.box{fill:#F1EFE8;stroke:#5F5E5A} .bt{fill:#444441}
.sock{fill:#E1F5EE;stroke:#0F6E56} .st{fill:#085041} .ss{fill:#0F6E56}
.ico{fill:#1D9E75;stroke:#1D9E75} .lbl{fill:#5F5E5A}
.arr{stroke:#73726C;stroke-width:1.5;fill:none} .head{stroke:#73726C}
@media (prefers-color-scheme:dark){
.box{fill:#2C2C2A;stroke:#B4B2A9} .bt{fill:#D3D1C7}
.sock{fill:#085041;stroke:#5DCAA5} .st{fill:#E1F5EE} .ss{fill:#9FE1CB}
.ico{fill:#5DCAA5;stroke:#5DCAA5} .lbl{fill:#B4B2A9}
.arr,.head{stroke:#9C9A92}
}
</style>
