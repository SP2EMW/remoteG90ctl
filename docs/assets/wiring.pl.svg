<!-- Połączenie G90, DE-19, karty I/Q i komputera. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" role="img" aria-labelledby="t d">
<title id="t">Połączenie G90, DE-19, karty I/Q i komputera</title>
<desc id="d">Gniazdo IO/User G90 na panelu przednim (postać w kółku) kablem jack do gniazda CI-V w DE-19; tylne gniazdo ACC kablem DIN do ACC w DE-19; wyjście I/Q kablem jack stereo do karty dźwiękowej I/Q. DE-19 i karta I/Q łączą się z komputerem przez USB.</desc>
<style>
